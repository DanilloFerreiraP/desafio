
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Pacientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/patients.css">
</head>
<body>

    <main class="container py-5">

        <h1 class="h3 mb-4">Gerenciamento de Pacientes</h1>

       <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <input
                            type="search"
                            id="search"
                            class="form-control"
                            placeholder="Pesquisar paciente pelo nome"
                            aria-label="Pesquisar paciente pelo nome"
                        >
                    </div>

                    <div class="col-md-4 text-md-end">
                        <button id="newPatient" class="btn btn-primary">
                            Novo paciente
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Unidade de saúde</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="patientsTable">
                            <tr>
                                <td colspan="4">Carregando pacientes...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card mt-4" id="patientFormCard" hidden>
            <div class="card-body">

                <h2 class="h5 mb-4" id="formTitle">
                    Novo paciente
                </h2>

                <form id="patientForm" novalidate>
                    <input type="hidden" id="patientId">

                    <div class="row">

                        <div class="col-md-6">
                            <label for="name" class="form-label">Nome</label>
                            <input type="text" id="name" class="form-control" required>
                            <div class="invalid-feedback" id="error-name"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" id="cpf" class="form-control" maxlength="14" required>
                            <div class="invalid-feedback" id="error-cpf"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="birth_date" class="form-label">Data de nascimento</label>
                            <input type="date" id="birth_date" class="form-control" required>
                            <div class="invalid-feedback" id="error-birth_date"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="phone" class="form-label">Telefone (opcional)</label>
                            <input type="tel" id="phone" class="form-control" maxlength="15">
                            <div class="invalid-feedback" id="error-phone"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="health_unit_id" class="form-label">Unidade de saúde</label>
                            <select id="health_unit_id" class="form-select" required>
                                <option value="">Selecione uma unidade</option>
                            </select>
                            <div class="invalid-feedback" id="error-health_unit_id"></div>
                        </div>

                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-success" id="savePatient">
                            Salvar
                        </button>
                        <button type="button" class="btn btn-secondary" id="cancelPatient">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <script src="/js/patients.js" defer></script>
</body>
</html>
